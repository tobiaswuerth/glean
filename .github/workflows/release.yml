name: Release

# Runs when CI has passed on a commit of main. When that commit's pyproject.toml names a version that has a section
# in CHANGELOG.md and no tag yet, it publishes that version to PyPI and makes a GitHub release, tagging that commit.
# A version without a changelog section isn't released, so main can carry unreleased work. See "Releasing" in
# CONTRIBUTING.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Only CI on a push to this repository's main counts: not a pull request, not even one from a fork's main.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  # the commit CI tested, which main may have moved past
      - name: Is this version to be released, and not released yet?
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version: not to be released yet."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is released already: nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv has no major-version tags
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi  # which deploys from main only
      url: https://pypi.org/project/glean-importer/
    permissions:
      id-token: write  # trusted publishing: PyPI verifies this workflow, no token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Tag the tested commit and make the GitHub release, with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          awk -v v="$VERSION" '/^## \[/ { found = index($0, "[" v "]") } found && !/^## \[/ && !/^\[.*\]: /' \
            CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/* --target "$COMMIT" --title "v$VERSION" --notes-file notes.md
